# control-panel configuration reference.
# Copy to /etc/control-panel/config.yaml and adjust.
# Every key is optional; the values shown are the defaults unless noted.

# Address the panel listens on. Keep it LAN-only (or bind 127.0.0.1 and put
# a reverse proxy/tailscale in front). Without TLS, prefer binding to a VPN
# address (e.g. the machine's tailscale IP) so the password never crosses
# the open network in cleartext.
listen: "0.0.0.0:9090"

# Runtime state: sessions, audit log, UI preferences, minecraft overrides.
data_dir: /var/lib/control-panel

# Reverse proxies (IPs or CIDRs) allowed to set X-Forwarded-For. Only needed
# when the panel sits behind nginx/caddy/traefik: it makes login rate limits
# and the audit log see real client addresses instead of the proxy's.
trusted_proxies: []
#  - 127.0.0.1
#  - 10.0.0.0/8

auth:
  # "password" (default) or "none". "none" disables login entirely — only
  # for networks where every device is trusted.
  mode: password
  # Generate with:  control-panel hash
  password_hash: ""
  # How long a login stays valid.
  session_hours: 168
  # mode "none" on a non-loopback listen is refused unless you explicitly
  # accept the risk (any device — or website open on one — can drive the
  # panel): allow_remote_none: true

# Optional direct TLS. Alternatively terminate TLS at a reverse proxy.
tls:
  cert: ""
  key: ""

metrics:
  # Sampling period while a browser is connected (ms). The sampler slows to
  # 10s automatically when nobody is watching.
  interval_ms: 1000
  # Points kept for charts (600 x 1s = 10 minutes).
  history: 600

storage:
  # mergerfs mount points. Empty = auto-detect every fuse.mergerfs mount.
  pools: []
  # Poll SMART via smartctl (apt install smartmontools). Standby drives are
  # never woken (-n standby).
  smart: true
  # Hide mounts from the panel.
  exclude_mounts: []
  snapraid:
    # Path to snapraid.conf; empty disables the integration.
    # When you add snapraid later, set this and restart the panel.
    config: ""
    # Explicit binary path if not on $PATH.
    binary: ""

services:
  # systemd units the panel may view and control. Anything not listed is
  # untouchable. Empty list = a sensible default set (plex, smbd, sshd,
  # docker, tailscaled, snapraid-sync.timer), showing only units that exist.
  units: []
  #  - plexmediaserver.service
  #  - smbd.service
  #  - sshd.service
  #  - snapraid-sync.timer
  # Set false to make the services page read-only.
  allow_actions: true

plex:
  url: "http://127.0.0.1:32400"
  # X-Plex-Token — grab it from any Plex Web request. Empty disables the
  # Plex page (service control still works via services).
  token: ""

# Media stack integrations — read-only status: download queues with
# progress, health warnings, missing/upcoming counts, pending requests.
# API keys are found in each app under Settings -> General -> Security.
apps: []
#  - type: radarr           # radarr | sonarr | lidarr | readarr | whisparr
#    url: http://127.0.0.1:7878        # | prowlarr | overseerr | jellyseerr
#    api_key: "…"
#  - type: sonarr
#    url: http://127.0.0.1:8989
#    api_key: "…"
#  - type: prowlarr
#    url: http://127.0.0.1:9696
#    api_key: "…"
#  - name: Jellyseerr       # optional display name
#    type: jellyseerr
#    url: http://127.0.0.1:5055
#    api_key: "…"

minecraft:
  # Every subdirectory containing a server jar / run.sh becomes a managed
  # server; the directory name is its id.
  root: /srv/minecraft
  # Default java executable (per-server override below).
  java: java
  # STRONGLY RECOMMENDED: run game servers as this unprivileged system user
  # instead of root. Mods and plugins are third-party code from the internet;
  # this keeps a malicious one away from the rest of the machine. Create the
  # user once with:  useradd --system --home /srv/minecraft --shell /usr/sbin/nologin minecraft
  # Server directories are chowned to this user each time a server starts.
  run_as: ""
  # Where backups are written (default <root>/.backups).
  backup_dir: ""
  # Restart servers that were running when the panel last shut down.
  resume: true
  # Per-server settings, keyed by directory name. The UI can adjust
  # mem/flags/autostart too (stored in data_dir, layered over these).
  servers: {}
  #  survival:
  #    mem: 6G            # -Xms/-Xmx
  #    aikar: true        # Aikar GC flags (recommended for Paper)
  #    autostart: true    # start with the panel
  #    auto_restart: true # relaunch after a crash (max 3 in 10 min)
  #  atm10:
  #    mem: 10G
  #    jar: neoforge-launcher.jar   # override jar auto-detection
  #    jvm_args: ["-Dfml.readTimeout=180"]

power:
  # Enable the reboot/shutdown endpoints (typed confirmation still required).
  allow: false

update:
  # In-panel self-updates from this GitHub repo's releases (Settings page).
  # Only this pinned repo is ever contacted; downloads are sha256-verified
  # against the release manifest before the binary is swapped and the
  # service restarted. Empty disables the updater.
  repo: ""
  # Fine-grained PAT with contents: read-only — required for private repos.
  token: ""
