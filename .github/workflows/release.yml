# Builds the release binary on every version tag and publishes it as a
# GitHub release with a checksum manifest. The panel's in-app updater
# (update.repo in config.yaml) installs exactly these artifacts after
# verifying SHA256SUMS.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # make release stamps the binary via git describe.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 25

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Build first: the httpd package embeds web/dist, so tests only
      # compile once the frontend has been built into the embed directory.
      - name: Build
        run: make release

      - name: Test
        run: go test ./...

      - name: Checksums
        working-directory: dist
        run: sha256sum control-panel-linux-amd64 > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/control-panel-linux-amd64 dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes

  # Panel Bar menu bar companion, attached to the same release as a
  # drag-to-Applications DMG (universal, ad-hoc signed — right-click Open
  # on first launch).
  macos-app:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: make mac-dmg

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --output SHA256SUMS
          (cd dist && shasum -a 256 PanelBar.dmg) >> SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" dist/PanelBar.dmg SHA256SUMS --clobber
